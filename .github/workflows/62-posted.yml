name: 62-posted (grafanalib vs Foundation SDK)

on:
  pull_request:
    paths:
      - "62-posted/**"
      - ".github/workflows/62-posted.yml"
  push:
    branches: [main]
    paths:
      - "62-posted/**"
      - ".github/workflows/62-posted.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 62-posted

jobs:
  compare:
    name: 생성 / 비교 / Grafana 업로드
    runs-on: ubuntu-latest
    services:
      grafana:
        image: grafana/grafana:12.0.1
        ports:
          - 3000:3000
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/api/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 62-posted/requirements.txt

      - uses: actions/setup-go@v5
        with:
          go-version-file: 62-posted/foundation_sdk_go/go.mod
          cache-dependency-path: 62-posted/foundation_sdk_go/go.sum

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: gofmt / go vet
        working-directory: 62-posted/foundation_sdk_go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...

      - name: build + compare + dist 최신 여부
        run: python tasks.py check

      - name: grafanalib → Go 초안 변환이 되는지
        run: python tasks.py convert

      - name: Grafana 12.0.1 에 세 결과물 업로드
        run: python tasks.py smoke --cleanup
